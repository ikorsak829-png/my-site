<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Семейные финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#0b0b0a;--card:#1a1a18;--tx:#f1f1ec;--mu:#8d8d85;--bd:#2a2a27;--ac:#b6c26a;--lime:#6f8a3c;--gr:#b6d06a;--rd:#e5806e;--or:#d9c58a;--inp:#242421}
html{background:#0b0b0a;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--tx);background:radial-gradient(900px 420px at 50% -12%,rgba(125,138,62,.30),transparent 62%),#0b0b0a;font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:400}
.w{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:19px;font-weight:500;margin:6px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1 .k{color:var(--mu)}h2{font-size:17px;font-weight:500;margin:0 0 10px}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:linear-gradient(#0b0b0a 75%,rgba(11,11,10,0));z-index:5}
nav button{white-space:nowrap;background:#1c1c1a;border:0;color:var(--tx);font-weight:500;padding:9px 18px;border-radius:999px}
nav button.on{background:var(--ac);color:#171c08;font-weight:600}
button,input,select{font:inherit;color:var(--tx);background:var(--inp);border:1px solid var(--bd);border-radius:14px;padding:9px 12px}
select option{background:#1a1a18;color:var(--tx)}
button{cursor:pointer;font-weight:500;background:#242421;border-color:transparent;border-radius:999px;padding:9px 16px}button:hover{filter:brightness(1.15)}
button.p{background:var(--ac);color:#171c08;font-weight:600}
input:focus,select:focus{outline:1px solid var(--ac);outline-offset:-1px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.c{background:var(--card);color:var(--tx);border:1px solid #242421;border-radius:22px;padding:16px;margin-bottom:12px}
.g>.c{margin-bottom:0}
.k{color:var(--mu);font-size:13px}.v{font-size:24px;font-weight:300;letter-spacing:-.01em}
.gr{color:var(--gr)}.rd{color:var(--rd)}.or{color:var(--or)}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--mu)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--ac);min-width:2px}.bt{background:#2c2c29;border-radius:4px}
.tr{display:flex;align-items:flex-end;gap:4px;height:130px}.tr div{flex:1;background:linear-gradient(var(--ac),rgba(182,194,106,.28));border-radius:6px 6px 0 0;min-height:3px}
.tl{display:flex;gap:4px;font-size:10px;color:var(--mu);margin-top:4px}.tl span{flex:1;text-align:center;overflow:hidden}
.x{background:none!important;border:none;color:var(--rd);padding:2px 6px}
.hide{display:none}
.bal{text-align:left;margin:10px 0 18px}.bal .k{color:var(--mu);font-size:14px}.bv{font-size:40px;font-weight:300;letter-spacing:-.02em;margin:2px 0}
.pill{display:inline-block;background:#242421;color:var(--ac);border-radius:999px;padding:5px 12px;font-weight:500;font-size:12px;margin-top:8px}
</style></head><body><div class="w">
<h1>💰 Семейные финансы <span id="sy" class="k" style="font-size:12px;font-weight:400"></span></h1>
<nav id="nav"></nav><div id="app"></div>
</div>
<script>
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const INC=['Доход Ильи','Доход Маши','Доп. доход'];
const DC=[['Квартира и ЖКУ 🔑','m'],['Продукты 🛒','m'],['Дом 🏠','m'],['Связь 📱','m'],['Машина 🚗','m'],['Здоровье 🚑','m'],['Транспорт 🚌','m'],['Домашние животные 🐕','m'],['Уход 🪥','o'],['Гардероб 👔','o'],['Спорт 🤺','o'],['Развлечения 🎪','o'],['Техника 🖥️','o'],['Сладости и фастфуд 🍔','o'],['Другое 📑','o']];
const RAW=[];
const CATS=[["Продукты🛒","m"],["Какашки💩","o"],["Машина🚗","m"],["Связь📱","m"],["Быт🛋️","m"],["Тренировки🤺","m"],["Бьюти💅","m"],["Лечение","m"],["ЖКУ🔑","m"],["Автобус🚌","m"],["Праздники🥳","m"],["Кафе☕","m"],["Гардерб👕","m"],["Цветы💐","m"],["Досуг😄","m"],["Квартира🏠","m"],["Гигиена🪥","m"],["Уход💇","m"],["Доп. устройствва🔋","m"],["Мелкие покупки","m"],["Локи🐕","m"],["Птица🐦","m"],["Техника🖥️","m"],["Аксесуары","m"],["Здоровье 🚑","m"],["Дом 🏠","m"]];
const TY={i:'income',e:'expense',t:'toSav',f:'fromSav',a:'adj'};
function seed(){let id=1;return{tx:RAW.map(r=>{const t={id:id++,date:r[0],type:TY[r[1]],amount:r[2],com:r[7]||''};if(r[3])t.cat=r[3];if(r[4])t.kind=r[4];if(r[5])t.sub=r[5];if(r[6])t.who=r[6];if(r[8]){t.cur=r[8];t.rate=r[9]}return t}),cats:CATS.map(c=>({n:c[0],k:c[1]})),goals:[],nid:RAW.length+1}}
let S=seed();
try{const r=localStorage.getItem('fin1');if(r){const o=JSON.parse(r);if(o.tx&&o.tx.length)S=o}}catch(e){}
const mig=o=>{o.tx.forEach(t=>{if(t.type=='expense'&&t.big===undefined&&(t.com||'').startsWith('(цель)'))t.big=true;if(t.cat=='Моя зарплата')t.cat='Доход Ильи';else if(t.cat=='Зарплата Маша')t.cat='Доход Маши'});return o};mig(S);
const TG=window.Telegram&&Telegram.WebApp,CS=(TG&&TG.initData&&TG.CloudStorage)||null;
const sy=t=>{const e=document.getElementById('sy');if(e)e.textContent=t};
const cs=(m,...a)=>new Promise((res,rej)=>CS[m](...a,(err,v)=>err?rej(err):res(v)));
let cache={},pushT;
const save=()=>{S.ts=Date.now();try{localStorage.setItem('fin1',JSON.stringify(S))}catch(e){}clearTimeout(pushT);pushT=setTimeout(push,1200)};
function chunks(s){const r=[];let i=0;while(i<s.length){let e=Math.min(i+3500,s.length);if(e<s.length){const c=s.charCodeAt(e-1);if(c>=0xD800&&c<0xDC00)e--}r.push(s.slice(i,e));i=e}return r}
async function push(){
  if(!CS)return;
  try{sy('☁️ сохранение…');const ch=chunks(JSON.stringify(S)),n=ch.length,old=+(cache.n||0);
    await Promise.all(ch.map((p,i)=>cache['d'+i]===p?0:cs('setItem','d'+i,p).then(()=>{cache['d'+i]=p})));
    await cs('setItem','meta',JSON.stringify({n,ts:S.ts}));
    if(old>n){const ks=[];for(let i=n;i<old;i++){ks.push('d'+i);delete cache['d'+i]}await cs('removeItems',ks)}
    cache.n=n;sy('☁️ синхронизировано')}catch(e){sy('⚠️ ошибка синхронизации')}
}
async function pull(){
  if(!CS)return;
  try{sy('☁️ загрузка…');const m=await cs('getItem','meta');
    if(!m){if(S.tx.length)await push();else sy('☁️ готово');return}
    const mt=JSON.parse(m);
    if(mt.ts>(S.ts||0)){const ks=[];for(let i=0;i<mt.n;i++)ks.push('d'+i);const v=await cs('getItems',ks),parts=ks.map(k=>v[k]||'');
      const o=mig(JSON.parse(parts.join('')));ks.forEach((k,i)=>cache[k]=parts[i]);cache.n=mt.n;S=o;
      try{localStorage.setItem('fin1',JSON.stringify(S))}catch(e){}render();sy('☁️ синхронизировано')}
    else if(mt.ts<(S.ts||0)){cache.n=mt.n;await push()}
    else sy('☁️ синхронизировано')
  }catch(e){sy('⚠️ ошибка синхронизации')}
}
const $=s=>document.querySelector(s);
const today=new Date().toISOString().slice(0,10);
const f=n=>(+n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const r=n=>f(n)+' BYN';
const p=n=>f(n)+' р.';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let clrAsk=false,gOpen=false,iy=today.slice(0,4),svc=null,om=today.slice(0,7),hm=today.slice(0,7),tab='home',st={mode:'month',a:today.slice(0,7),b:''},form={type:'expense'};
const TABS=[['home','Главная'],['ops','Операции'],['sav','Сбережения'],['stat','Статистика'],['cats','Категории']];
const sorted=()=>[...S.tx].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);

function calc(){
  const sv={BYN:{a:0,b:0},USD:{a:0,b:0},EUR:{a:0,b:0}};let prior=0;
  for(const t of sorted()){
    if(t.type=='income')prior+=t.amount;
    else if(t.type=='expense')prior-=t.amount;
    else if(t.type=='adj')prior+=t.amount;
    else if(t.type=='sadj'){const s=sv[t.cur];s.a+=t.fx;s.b+=t.amount}
    else if(t.type=='toSav'){prior-=t.amount;const s=sv[t.cur];s.b+=t.amount;s.a+=t.cur=='BYN'?t.amount:(t.fx!=null?t.fx:t.amount/t.rate)}
    else if(t.type=='fromSav'){prior+=t.amount;const s=sv[t.cur];
      if(t.cur=='BYN'){s.a-=t.amount;s.b-=t.amount}else{const fe=t.fx!=null?t.fx:t.amount/t.rate,avg=s.a?s.b/s.a:t.rate;s.a-=fe;s.b-=fe*avg}}
  }
  const total=sv.BYN.b+sv.USD.b+sv.EUR.b;
  const ms={};S.tx.filter(t=>t.type=='expense'&&!t.big).forEach(t=>{const m=t.date.slice(0,7);ms[m]=(ms[m]||0)+t.amount});
  let keys=Object.keys(ms).sort();if(keys.length>1)keys=keys.filter(k=>k!=today.slice(0,7));
  const avg=keys.length?keys.reduce((s,k)=>s+ms[k],0)/keys.length:0;
  return{sv,prior,total,avg,months:avg?total/avg:0,nm:keys.length};
}
const sumBy=(arr,fn)=>arr.reduce((m,t)=>{const k=fn(t);m[k]=(m[k]||0)+t.amount;return m},{});

function render(){
  $('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${tab==t[0]?'on':''}">${t[1]}</button>`).join('');
  $('#app').innerHTML=({home,ops,sav,goals,stat,cats})[tab]();
  upd();
}
function home(){
  const c=calc(),m=hm,mt=S.tx.filter(t=>t.date.startsWith(m));
  const inc=sumBy(mt.filter(t=>t.type=='income'),t=>t.cat),ex=mt.filter(t=>t.type=='expense'),
  ti=Object.values(inc).reduce((a,b)=>a+b,0),te=ex.reduce((a,t)=>a+t.amount,0),
  fs=mt.filter(t=>t.type=='fromSav').reduce((a,t)=>a+t.amount,0),ts=mt.filter(t=>t.type=='toSav').reduce((a,t)=>a+t.amount,0);
  return `<div class="bal"><div class="k">Остаток на Приор</div><div class="bv">${r(c.prior)}</div><div class="pill">${ti-te>=0?'+':'−'}${p(Math.abs(ti-te))} · ${MN[+m.slice(5)-1]}</div></div>
  <div class="c"><h2>Бюджет: ${MN[+m.slice(5)-1]} ${m.slice(0,4)} ${mpick('hm',m,1)}</h2><table>
  ${INC.map(n=>`<tr><td>${n}</td><td class="n gr">${p(inc[n])}</td></tr>`).join('')}
  <tr><td><b>Бюджет (доходы)</b></td><td class="n"><b>${p(ti)}</b></td></tr>
  <tr><td>Расходы</td><td class="n rd">${p(te)}</td></tr>
  <tr><td>Переведено в сбережения</td><td class="n">${p(ts)}</td></tr>
  <tr><td>Взято из сбережений</td><td class="n">${p(fs)}</td></tr>
  <tr><td><b>Сальдо месяца (доходы − расходы)</b></td><td class="n ${ti-te<0?'rd':'gr'}"><b>${p(ti-te)}</b></td></tr></table></div>
  <div class="c"><h2>Сверка остатка Приор</h2><div class="k">Если расчётный остаток не совпадает с реальным, введите фактический: приложение добавит корректировку.</div><div style="display:flex;gap:6px;margin-top:6px"><input type="number" step="0.01" id="rc" placeholder="Фактический остаток"><button data-act="rec">Сверить</button></div></div>
  <div class="c k">Данные хранятся в облаке Telegram и синхронизируются между вашими устройствами. Резервную копию всё равно делайте во вкладке «Категории».</div>`;
}
function mpick(key,val,noY){const y=+val.slice(0,4),m=+val.slice(5,7),y0=Math.min(2025,y),y1=Math.max(new Date().getFullYear()+1,y),ys=[];for(let i=y0;i<=y1;i++)ys.push(i);
  return `<span style="margin-left:8px;white-space:nowrap"><select data-mp="${key}" data-y="${y}">${MN.map((n,i)=>`<option value="${i+1}" ${i+1==m?'selected':''}>${n}</option>`).join('')}</select>${noY?'':` <select data-mp="${key}">${ys.map(v=>`<option ${v==y?'selected':''}>${v}</option>`).join('')}</select>`}</span>`}
function ops(){
  const t=form.type,isT=t=='toSav'||t=='fromSav',cs=S.cats;
  const first=cs[0]||{n:'',k:'m'};
  const list=sorted().reverse().filter(x=>x.date.startsWith(om));
  const lbl={income:'Доход',expense:'Расход',toSav:'→ Сбережения',fromSav:'← Из сбережений'};
  const lbl2={income:'Доход',expense:'Расход',toSav:'→ Сбережения',fromSav:'← Из сбережений',adj:'Корректировка',sadj:'Корректировка сбережений'};
  const dfm=d=>d.slice(8)+'.'+d.slice(5,7);
  return `<div class="c"><h2>Новая операция</h2>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${Object.keys(lbl).map(k=>`<button data-ty="${k}" class="${t==k?'p':''}">${lbl[k]}</button>`).join('')}</div>
  <div class="f">
  <label>Дата<input type="date" id="d" value="${today}"></label>
  <label><span id="al">Сумма (BYN)</span><input type="number" step="0.01" id="a" inputmode="decimal"></label>
  ${t=='income'?`<label>Категория<select id="c">${INC.map(n=>`<option>${n}</option>`).join('')}</select></label>`:''}
  ${t=='expense'?`<label>Категория<select id="c">${cs.map(c=>`<option data-k="${c.k}">${esc(c.n)}</option>`).join('')}</select></label>`:''}
  ${isT||t=='income'?`<label>Валюта<select id="cu"><option>BYN</option><option>USD</option><option>EUR</option></select></label>
  <label id="rl" ${t=='income'?'style="display:none"':''}>Курс (BYN за 1 ед.)<input type="number" step="0.0001" id="r" inputmode="decimal" placeholder="для USD/EUR"></label>`:''}${t=='income'?'<label id="bl" style="display:none">Сумма в BYN<input type="number" step="0.01" id="b" inputmode="decimal"></label>':''}
  ${t=='expense'?'<label>Кто<select id="w"><option>Семейный</option><option>Илья</option><option>Маша</option></select></label>':''}<label>Комментарий${isT?' *':''}<input id="m" placeholder="${isT?'обязательно':'необязательно'}"></label></div>
  <p class="k" id="pv"></p><button class="p" data-act="add">Добавить</button> <span id="er" class="rd"></span></div>
  <div class="c sc"><h2>Операции за ${mpick('om',om)}</h2><table><tr><th>Дата</th><th>Вид</th><th class="n">Сумма</th><th>Категория</th><th>Комментарий</th><th></th></tr>
  ${list.map(x=>`<tr><td>${dfm(x.date)}</td><td>${lbl2[x.type]}</td><td class="n ${x.type=='expense'?'rd':x.type=='income'||x.type=='fromSav'?'gr':''}">${x.type=='sadj'?(x.cur=='BYN'?p(x.amount):f(x.fx)+' '+x.cur+'<div class="k">'+p(x.amount)+'</div>'):x.cur&&x.cur!='BYN'?`${f(x.fx!=null?x.fx:x.amount/x.rate)} ${x.cur}<div class="k">${p(x.amount)} · курс ${f(x.rate)}</div>`:p(x.amount)}</td><td>${x.type=='income'?`<select data-ic="${x.id}" style="padding:4px 6px">${INC.map(n=>`<option ${n==x.cat?'selected':''}>${n}</option>`).join('')}</select>`:esc(x.cat||'')}${x.big?' ⭐':''}</td><td>${esc(x.com)}</td><td>${x.type=='expense'?`<button class="x" style="color:var(--or)" title="Крупная покупка: не учитывать в подушке" data-big="${x.id}">${x.big?'★':'☆'}</button>`:''}<button class="x" data-del="${x.id}">✕</button></td></tr>`).join('')||'<tr><td colspan=6 class="k">Пока пусто</td></tr>'}</table>
  <div style="margin-top:10px">${clrAsk?`<span class="rd">Удалить все ${list.length} операций за ${MN[+om.slice(5)-1]}?</span> <button class="p" data-clr="2">Да, удалить</button> <button data-clr="0">Отмена</button>`:(list.length?`<button data-clr="1">Очистить месяц</button>`:'')}</div></div>`;
}
function svDetail(k,name){
  let bal=0;const yr=today.slice(0,4),cc=calc().sv[k];
  const rows=sorted().filter(t=>(t.type=='toSav'||t.type=='fromSav'||t.type=='sadj')&&t.cur==k).map(t=>{
    const sa=t.type=='sadj',rate=k=='BYN'?1:t.rate,fe=sa?t.fx:(k=='BYN'?t.amount:(t.fx!=null?t.fx:t.amount/t.rate)),plus=sa?fe>=0:t.type=='toSav';bal+=sa?fe:(plus?fe:-fe);
    const d=t.date.slice(8)+'.'+t.date.slice(5,7)+(t.date.slice(0,4)!=yr?'.'+t.date.slice(2,4):'');
    return `<tr><td>${d}</td><td>${sa?'✎ Корректировка':plus?'→ Сбережения':'← Из сбережений'}</td><td class="n ${plus?'':'gr'}">${plus?'+':'−'}${p(Math.abs(t.amount))}</td>${k!='BYN'?`<td class="n">${plus?'+':'−'}${f(Math.abs(fe))} ${k}</td><td class="n">${sa?'—':f(rate)}</td>`:''}<td class="n">${f(bal)} ${k}</td><td>${esc(t.com)}</td><td>${sa?`<button class="x" data-del="${t.id}">✕</button>`:''}</td></tr>`}).reverse();
  return `<div class="sc" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)">
  <div class="k" style="margin-bottom:6px">Корректировка: введите фактическую сумму, приложение добавит разницу отдельной строкой (на Приор она не влияет).</div>
  <div class="f"><label>Фактическая сумма (${k})<input type="number" step="0.01" id="sa" inputmode="decimal" placeholder="сейчас ${f(cc.a)}"></label>${k!='BYN'?`<label>Стоимость в BYN (по курсам покупки)<input type="number" step="0.01" id="sb" inputmode="decimal" placeholder="сейчас ${f(cc.b)}"></label>`:''}<label>Комментарий<input id="sm"></label></div>
  <p></p><button class="p" data-act="sadj">Применить корректировку</button><p></p>
  <table><tr><th>Дата</th><th>Операция</th><th class="n">Сумма BYN</th>${k!='BYN'?`<th class="n">В валюте</th><th class="n">Курс</th>`:''}<th class="n">Остаток</th><th>Комментарий</th><th></th></tr>${rows.join('')||'<tr><td class="k" colspan=8>Операций нет</td></tr>'}</table><div class="k">Сверху новые. Остаток считается нарастающим итогом.</div></div>`}
function sav(){return savMain()+'<h2 style="margin:6px 0 10px">🎯 Цели</h2>'+goals()}
function savChart(){
  const c=calc(),it=[['BYN','Белорусский рубль','var(--ac)'],['USD','Доллар США','var(--lime)'],['EUR','Евро','var(--or)']].map(a=>({k:a[0],n:a[1],col:a[2],v:Math.max(0,c.sv[a[0]].b)})),tot=it.reduce((s,x)=>s+x.v,0);
  const ex=`<div style="display:flex;flex-direction:column;gap:18px">

function saveRate(){
  const cur=today.slice(0,7),ms=new Set(S.tx.filter(t=>t.type=='income'||t.type=='expense').map(t=>t.date.slice(0,7)));

function inP(k){return st.mode=='day'?`<input type="date" data-p="${k}" value="${st[k]}">`:st.mode=='month'?mpick(k,st[k]):`<input type="number" data-p="${k}" value="${st[k]}" style="width:100px">`}

  <tr><td><b>За ${y}</b></td>${all.map(a=>`<td class="n"><b>${p(a.reduce((s,z)=>s+z,0))}</b></td>`).join('')}<td></td></tr></table></div>`}
function stat(){
  const ex=S.tx.filter(t=>t.type=='expense'),A=ex.filter(t=>t.date.startsWith(st.a));

  const wd=Array(7).fill(0);A.forEach(t=>{wd[(new Date(t.date).getDay()+6)%7]+=t.amount});const wm=Math.max(...wd,1);
  const top=[...A].sort((x,y)=>y.amount-x.amount).slice(0,5);

  ${['day','month','year'].map((m,i)=>`<button data-m="${m}" class="${st.mode==m?'p':''}">${['День','Месяц','Год'][i]}</button>`).join('')}
  ${inP('a')}</div></div>
  <div class="g"><div class="c"><div class="k">Расходы</div><div class="v">${r(ta)}</div></div>
  <div class="c"><div class="k">Доходы / сальдо</div><div class="v">${r(inc)}</div><div class="k ${inc-ta<0?'rd':'gr'}">${p(inc-ta)}</div></div>
  <div class="c"><div class="k">Средний расход в день с тратами</div><div class="v">${r(days?ta/days:0)}</div></div>
  <div class="c"><div class="k">Обязательные / необязательные</div><div class="v">${ta?(must/ta*100).toFixed(0):0}% / ${ta?(100-must/ta*100).toFixed(0):0}%</div><div class="k">${p(must)} / ${p(ta-must)}</div></div></div>
  ${tr}
  <div class="c sc"><h2>По категориям</h2><table><tr><th>Категория</th><th class="n">Сумма</th><th class="n">Доля</th><th style="width:25%"></th></tr>
  ${names.map(n=>`<tr><td>${esc(n)}</td><td class="n">${p(ca[n])}</td><td class="n">${ta?((ca[n]||0)/ta*100).toFixed(1):'0.0'}%</td><td><div class="bt"><div class="bar" style="width:${(ca[n]||0)/mx*100}%"></div></div></td></tr>`).join('')||'<tr><td class="k">Нет данных</td></tr>'}</table></div>
  <div class="c"><h2>По дням недели</h2>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>`<div style="display:flex;gap:8px;align-items:center"><span style="width:24px">${d}</span><div class="bt" style="flex:1"><div class="bar" style="width:${wd[i]/wm*100}%"></div></div><span class="k" style="width:80px;text-align:right">${p(wd[i])}</span></div>`).join('')}</div>
  <div class="c sc"><h2>Кто тратил</h2><table>${Object.entries(sumBy(A,t=>t.who||'—')).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${p(v)}</td><td class="n">${ta?(v/ta*100).toFixed(0):0}%</td></tr>`).join('')||'<tr><td class="k">Нет данных</td></tr>'}</table></div>
  <div class="c sc"><h2>Топ-5 крупных трат</h2><table>${top.map(t=>`<tr><td>${t.date}</td><td>${esc(t.cat)}</td><td>${esc(t.com)}</td><td class="n">${p(t.amount)}</td></tr>`).join('')||'<tr><td class="k">Нет данных</td></tr>'}</table></div>
  ${incBlock()}`;
}
function cats(){
  return `<div class="c"><h2>Категории расходов</h2><div class="f"><label>Название<input id="cn" placeholder="например, Путешествия ✈️"></label>

document.addEventListener('click',e=>{
  const cv=e.target.closest('[data-sv]');if(cv&&!e.target.closest('button')){svc=svc==cv.dataset.sv?null:cv.dataset.sv;render();return}
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.t){tab=d.t;clrAsk=false}
  else if(d.clr){if(d.clr=='2'){S.tx=S.tx.filter(t=>!t.date.startsWith(om));save();clrAsk=false}else clrAsk=d.clr=='1'}
  else if(d.ty){form.type=d.ty}
  else if(d.m){st.mode=d.m;def()}
  else if(d.del){S.tx=S.tx.filter(t=>t.id!=d.del);save()}
  else if(d.big){const x=S.tx.find(t=>t.id==d.big);if(x){x.big=!x.big;save()}}
  else if(d.gt){gOpen=!gOpen}
  else if(d.act=='sadj'){const k=svc,c=calc().sv[k],t=parseFloat($('#sa').value);if(isNaN(t))return;
    const sb=$('#sb'),bv=sb&&sb.value!==''?parseFloat(sb.value):null,dfx=t-c.a,rd=x=>Math.round(x*100)/100;
    const dbv=k=='BYN'?dfx:(bv!=null&&!isNaN(bv)?bv-c.b:(c.a>0?dfx*(c.b/c.a):0));
    if(Math.abs(dfx)<0.005&&Math.abs(dbv)<0.005)return;
    S.tx.push({id:S.nid++,type:'sadj',date:today,cur:k,fx:rd(dfx),amount:rd(dbv),com:($('#sm').value||'').trim()||'Корректировка сбережений'});save()}
  else if(d.ce){const i=+d.ce,nm=($('#cne'+i).value||'').trim(),k=$('#cke'+i).value,old=S.cats[i];
    if(!nm||!old||S.cats.some((c,j)=>j!=i&&c.n==nm))return;
    S.tx.forEach(t=>{if(t.type=='expense'&&t.cat==old.n){t.cat=nm;t.kind=k}});S.cats[i]={n:nm,k};save()}
  else if(d.cd){S.cats.splice(+d.cd,1);save()}
  else if(d.gd){S.goals.splice(+d.gd,1);save()}
  else if(d.gp){const v=+$('#gp'+d.gp).value;if(v>0){S.goals[+d.gp].saved+=v;save()}}
  else if(d.act=='add'){if(!add())return}
  else if(d.act=='goal'){const n=$('#gn').value.trim(),c=+$('#gc').value;if(!n||!c)return;S.goals.push({name:n,cost:c});save()}
  else if(d.act=='cat'){const n=$('#cn').value.trim();if(!n)return;S.cats.push({n,k:$('#ck').value});save()}
  else if(d.act=='exp'){$('#js').value=JSON.stringify(S);return}
  else if(d.act=='imp'){try{const o=JSON.parse($('#js').value);if(o.tx){S=mig(o);save()}}catch(x){return}}
  else if(d.act=='seed'){S=seed();save()}
  else if(d.act=='rec'){const v=parseFloat($('#rc').value);if(isNaN(v))return;const df=v-calc().prior;if(Math.abs(df)>=0.005){S.tx.push({id:S.nid++,type:'adj',date:today,amount:Math.round(df*100)/100,com:'Сверка остатка Приор'});save()}}
  else return;
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ic){const x=S.tx.find(z=>z.id==t.dataset.ic);if(x){x.cat=t.value;save();render()}return}
  if(t.dataset.iy){iy=t.value;render();return}
  if(t.dataset.mp){const k=t.dataset.mp,s=document.querySelectorAll('[data-mp="'+k+'"]'),v=(s[1]?s[1].value:s[0].dataset.y)+'-'+String(s[0].value).padStart(2,'0');
    if(k=='om')om=v;else if(k=='hm')hm=v;else st[k]=v;render()}
  else if(t.dataset.om){om=t.value||om;render()}
  else if(t.dataset.hm){hm=t.value||hm;render()}
  else if(t.dataset.p){st[t.dataset.p]=t.value;render()}

function upd(){
  const cu=$('#cu');if(!cu)return;const c=cu.value,al=$('#al'),pv=$('#pv');
  if(al)al.textContent='Сумма ('+c+')';
  if(form.type=='income'){const fo=c!='BYN';$('#rl').style.display=$('#bl').style.display=fo?'':'none';if(pv)pv.textContent='';return}
  if(!pv)return;
  if(form.type=='fromSav'&&c!='BYN'){const a=+$('#a').value,r=+$('#r').value,s=calc().sv[c];
    pv.textContent='Доступно: '+f(s.a)+' '+c+(s.a>0?' (средний курс покупки '+f(s.b/s.a)+')':'')+(a>0&&r>0?' · В Приор поступит '+p(a*r):'')}

  else pv.textContent=''}
document.addEventListener('input',e=>{const id=e.target.id;if(id=='a'||id=='r'||id=='b'){
  if(form.type=='income'&&$('#b')){const a=+$('#a').value,r=+$('#r').value,b=+$('#b').value;

function add(){
  const type=form.type,amt=+$('#a').value,er=$('#er');
  if(!(amt>0)){er.textContent='Введите сумму';return false}
  const t={id:S.nid++,type,date:$('#d').value||today,amount:amt,com:$('#m').value.trim()};
  if(type=='income')t.cat=$('#c').value;
  if(type=='expense'){t.cat=$('#c').value;const cc=S.cats.find(c=>c.n==t.cat);t.kind=cc?cc.k:'m'}
  if(type=='toSav'||type=='fromSav'){
    t.cur=$('#cu').value;t.rate=+$('#r').value;
    if(!t.com){er.textContent='Укажите комментарий к переводу';return false}
    if(t.cur!='BYN'&&!(t.rate>0)){er.textContent='Укажите курс';return false}
    if(type=='toSav'&&t.cur!='BYN'){t.fx=amt;t.amount=Math.round(amt*t.rate*100)/100}
    if(type=='fromSav'){const av=calc().sv[t.cur].a;
      if(amt>av+0.005){er.textContent='Недостаточно '+t.cur+' (доступно '+f(av)+')';return false}
      if(t.cur!='BYN'){t.fx=amt;t.amount=Math.round(amt*t.rate*100)/100}}
  }
  if(type=='income'){const cu=$('#cu').value;if(cu!='BYN'){const r=+$('#r').value,b=+$('#b').value;
    if(!(r>0)&&!(b>0)){er.textContent='Укажите курс или сумму в BYN';return false}
    t.cur=cu;t.fx=amt;t.amount=b>0?Math.round(b*100)/100:Math.round(amt*r*100)/100;t.rate=+(t.amount/amt).toFixed(4)}}
  const bg=$('#bg');if(bg&&bg.checked)t.big=true;const w=$('#w');if(w)t.who=w.value;const s=$('#s');if(s&&s.value.trim())t.sub=s.value.trim();S.tx.push(t);save();return true;
}
