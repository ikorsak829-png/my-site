  else if(d.th){{const o=['light','violet','dark'],cur=document.documentElement.getAttribute('data-theme');setTheme(o[(o.indexOf(cur)+1)%3])}}

    if(Math.abs(dfx)<0.005&&Math.abs(dbv)<0.005)return;
    S.tx.push({id:S.nid++,type:'sadj',date:today,cur:k,fx:rd(dfx),amount:rd(dbv),com:($('#sm').value||'').trim()||'Корректировка сбережений'});save()}

  else if(d.ce){const i=+d.ce,nm=($('#cne'+i).value||'').trim(),k=$('#cke'+i).value,old=S.cats[i];
    if(!nm||!old||S.cats.some((c,j)=>j!=i&&c.n==nm))return;
    S.tx.forEach(t=>{if(t.type=='expense'&&t.cat==old.n){t.cat=nm;t.kind=k}});S.cats[i]={n:nm,k};save()}

  else if(d.act=='add'){if(!add())return}
  else if(d.act=='goal'){const n=$('#gn').value.trim(),c=+$('#gc').value;if(!n||!c)return;S.goals.push({name:n,cost:c});save()}
  else if(d.act=='cat'){const n=$('#cn').value.trim();if(!n)return;S.cats.push({n,k:$('#ck').value});save()}
  else if(d.act=='exp'){$('#js').value=JSON.stringify(S);return}
  else if(d.act=='imp'){try{const o=JSON.parse($('#js').value);if(o.tx){S=mig(o);save()}}catch(x){return}}
  else if(d.act=='seed'){S=seed();save()}
  else if(d.act=='rec'){const v=parseFloat($('#rc').value);if(isNaN(v))return;const df=v-calc().prior;if(Math.abs(df)>=0.005){S.tx.push({id:S.nid++,type:'adj',date:today,amount:Math.round(df*100)/100,com:'Сверка остатка Приор'});save()}}
  else return;
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ic){const x=S.tx.find(z=>z.id==t.dataset.ic);if(x){x.cat=t.value;save();render()}return}
  if(t.dataset.iy){iy=t.value;render();return}
  if(t.dataset.mp){const k=t.dataset.mp,s=document.querySelectorAll('[data-mp="'+k+'"]'),v=(s[1]?s[1].value:s[0].dataset.y)+'-'+String(s[0].value).padStart(2,'0');
    if(k=='om')om=v;else if(k=='hm')hm=v;else st[k]=v;render()}
  else if(t.dataset.om){om=t.value||om;render()}
  else if(t.dataset.hm){hm=t.value||hm;render()}
  else if(t.dataset.p){st[t.dataset.p]=t.value;render()}
  else if(t.id=='cu'){upd()}
  });
function chartHover(e){const t=e.target;if(!t||!t.closest)return;
  const g=t.closest('.pt');if(g){const sv=g.closest('svg');sv.querySelectorAll('.pt.act').forEach(x=>x.classList.remove('act'));g.classList.add('act');sv.classList.add('hv')}
  const b=t.closest('.tr div');if(b){b.parentNode.querySelectorAll('.act').forEach(x=>x.classList.remove('act'));b.classList.add('act')}}
document.addEventListener('pointerover',chartHover);document.addEventListener('click',chartHover);
function upd(){
  const cu=$('#cu');if(!cu)return;const c=cu.value,al=$('#al'),pv=$('#pv');
  if(al)al.textContent='Сумма ('+c+')';
  if(form.type=='income'){const fo=c!='BYN';$('#rl').style.display=$('#bl').style.display=fo?'':'none';if(pv)pv.textContent='';return}
  if(!pv)return;
  if(form.type=='fromSav'&&c!='BYN'){const a=+$('#a').value,r=+$('#r').value,s=calc().sv[c];
    pv.textContent='Доступно: '+f(s.a)+' '+c+(s.a>0?' (средний курс покупки '+f(s.b/s.a)+')':'')+(a>0&&r>0?' · В Приор поступит '+p(a*r):'')}
  else if(form.type=='fromSav')pv.textContent='Доступно: '+p(calc().sv.BYN.a);
  else if(form.type=='toSav'&&c!='BYN'){const a=+$('#a').value,r=+$('#r').value;
    pv.textContent=a>0&&r>0?'С Приор спишется '+p(a*r):'Укажите курс покупки: сколько BYN вы платите за 1 '+c}
  else pv.textContent=''}
document.addEventListener('input',e=>{const id=e.target.id;if(id=='a'||id=='r'||id=='b'){
  if(form.type=='income'&&$('#b')){const a=+$('#a').value,r=+$('#r').value,b=+$('#b').value;
    if(id=='b'){if(a>0&&b>0)$('#r').value=+(b/a).toFixed(4)}else if(a>0&&r>0)$('#b').value=Math.round(a*r*100)/100}
  upd()}});
function add(){
  const type=form.type,amt=+$('#a').value,er=$('#er');
  if(!(amt>0)){er.textContent='Введите сумму';return false}
  const t={id:S.nid++,type,date:$('#d').value||today,amount:amt,com:$('#m').value.trim()};
  if(type=='income')t.cat=$('#c').value;
  if(type=='expense'){t.cat=$('#c').value;const cc=S.cats.find(c=>c.n==t.cat);t.kind=cc?cc.k:'m'}
  if(type=='toSav'||type=='fromSav'){
    t.cur=$('#cu').value;t.rate=+$('#r').value;
    if(!t.com){er.textContent='Укажите комментарий к переводу';return false}
    if(t.cur!='BYN'&&!(t.rate>0)){er.textContent='Укажите курс';return false}
    if(type=='toSav'&&t.cur!='BYN'){t.fx=amt;t.amount=Math.round(amt*t.rate*100)/100}
    if(type=='fromSav'){const av=calc().sv[t.cur].a;
      if(amt>av+0.005){er.textContent='Недостаточно '+t.cur+' (доступно '+f(av)+')';return false}
      if(t.cur!='BYN'){t.fx=amt;t.amount=Math.round(amt*t.rate*100)/100}}
  }
  if(type=='income'){const cu=$('#cu').value;if(cu!='BYN'){const r=+$('#r').value,b=+$('#b').value;
    if(!(r>0)&&!(b>0)){er.textContent='Укажите курс или сумму в BYN';return false}
    t.cur=cu;t.fx=amt;t.amount=b>0?Math.round(b*100)/100:Math.round(amt*r*100)/100;t.rate=+(t.amount/amt).toFixed(4)}}
  const bg=$('#bg');if(bg&&bg.checked)t.big=true;const w=$('#w');if(w)t.who=w.value;const s=$('#s');if(s&&s.value.trim())t.sub=s.value.trim();S.tx.push(t);save();return true;
}
render();
sy(window.claude?'':'локально, без синхронизации');
(async()=>{try{
  if(!window.claude)return;
  const db=await claude.use('db'),user=await claude.use('user');
  if(!db||!user)return;uid=await user.id();if(!uid)return;DBX=db;
  await dbPull();
  db.doc('data/users/'+uid+'/meta').onSnapshot(s=>{if(!s.exists||choose)return;const md=s.data();let sd=null;try{sd=localStorage.getItem('fin1sync')}catch(e){}if(sd&&md.ts>(S.ts||0))dbLoad(md)},()=>{});
}catch(e){sy('⚠️ нет синхронизации')}})();
</script></body></html>
